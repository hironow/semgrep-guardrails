rules:
  - id: clean-architecture.domain-imports-infrastructure-typescript
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [WHY] Domain layer is importing from the infrastructure layer. In Clean Architecture,
      the domain must have ZERO external dependencies. Importing infrastructure (DB, HTTP,
      config, logging) into domain code couples business logic to implementation details.
      [HOW] Define an interface in the domain/usecase layer. Implement it in the
      infrastructure layer. Use dependency injection (constructor params) to wire them.
    pattern-regex: "(?:import|from)\\s+['\"](?:\\.\\./)*(?:infrastructure|infra)(?:/[^'\"]*)?['\"]"
    paths:
      include:
        - "**/domain/**"
        - "**/model/**"
        - "**/models/**"
        - "**/entity/**"
        - "**/entities/**"
    metadata:
      category: clean-architecture
      rule-origin: ai-tools/okite-ai/skills/clean-architecture

  - id: clean-architecture.domain-imports-adapter-typescript
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [WHY] Domain layer is importing from the adapter/controller layer. The domain
      must not depend on any outer layer.
      [HOW] Define an interface in the domain layer. Implement in the adapter layer.
    pattern-regex: "(?:import|from)\\s+['\"](?:\\.\\./)*(?:adapter|adapters|controller|controllers|gateway|gateways|handler|handlers|presenter|presenters)(?:/[^'\"]*)?['\"]"
    paths:
      include:
        - "**/domain/**"
        - "**/model/**"
        - "**/models/**"
        - "**/entity/**"
        - "**/entities/**"
    metadata:
      category: clean-architecture
      rule-origin: ai-tools/okite-ai/skills/clean-architecture
