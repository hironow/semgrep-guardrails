rules:
  - id: clean-architecture.sql-in-domain-typescript
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [WHY] SQL string literal found in domain layer. Domain must NOT contain SQL or
      DB access code — it couples business rules to storage technology.
      [HOW] Move SQL to repository implementation in the adapter layer. Domain layer
      should only contain entities, value objects, domain services, and domain events.
    pattern-regex: "(?i)(?:SELECT|INSERT|UPDATE|DELETE|CREATE TABLE|ALTER TABLE|DROP TABLE)\\s"
    paths:
      include:
        - "**/domain/**"
        - "**/model/**"
        - "**/models/**"
        - "**/entity/**"
        - "**/entities/**"
    metadata:
      category: clean-architecture
      rule-origin: ai-tools/okite-ai/skills/clean-architecture/references/layer-responsibilities.md
