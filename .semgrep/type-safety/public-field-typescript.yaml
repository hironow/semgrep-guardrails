rules:
  - id: domain-primitives.public-string-property-typescript
    languages: [typescript]
    severity: INFO
    message: >-
      [WHY] Class `$TYPE` has a public `string` property for a domain concept
      ($FIELD). Raw primitives bypass domain validation — invalid values
      (empty strings, injection payloads, wrong formats) can be assigned at any time
      without type-level protection. This is "primitive obsession".
      [HOW] Create a branded type or wrapper class with a parse/factory function:
      `type Email = string & { __brand: 'Email' };`
      `function parseEmail(s: string): Email { ... }`.
      Or use a class with private constructor and static factory.
      See: "Secure by Design" — Domain Primitives.
    pattern-regex: "(?:public\\s+|readonly\\s+)?(?:email|name|phone|address|url|token|password|secret)\\s*:\\s*string"
    paths:
      exclude:
        - "*.dto.*"
        - "*.entity.*"
        - "**/dto/**"
        - "**/entities/**"
    metadata:
      category: domain-primitives
      rule-origin: ai-tools/okite-ai/skills/domain-primitives-and-always-valid
