rules:
  - id: security.hardcoded-secret-python
    languages: [python]
    severity: ERROR
    message: >-
      [WHY] Hardcoded secret in source code. Security standards: "Never commit secrets;
      store in secret manager or env."
      [HOW] Load from environment: `os.environ["API_KEY"]` or use a secret manager.
      Validate required env vars at startup.
    pattern-regex: "(?i)(?:password|secret|api_key|apikey|token|private_key)\\s*=\\s*[\"'][^\"']{8,}[\"']"
    paths:
      exclude:
        - "**/test_*"
        - "**/*_test.py"
        - "**/tests/**"
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md
