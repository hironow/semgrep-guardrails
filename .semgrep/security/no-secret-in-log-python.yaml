rules:
  - id: security.password-in-log-python
    languages: [python]
    severity: ERROR
    message: >-
      [WHY] Logging sensitive data (password/secret/token/api_key) leaks credentials
      into log storage and monitoring. Security standards: "Never log passwords,
      tokens, secrets, full PII."
      [HOW] Remove the sensitive value from the log. Log only the operation result
      or a redacted placeholder.
    pattern-either:
      - pattern: logging.info(..., password=..., ...)
      - pattern: logging.error(..., password=..., ...)
      - pattern: logging.debug(..., password=..., ...)
      - pattern: logging.warning(..., password=..., ...)
      - pattern: $LOGGER.info(..., password=..., ...)
      - pattern: $LOGGER.error(..., password=..., ...)
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md

  - id: security.fstring-secret-in-log-python
    languages: [python]
    severity: ERROR
    message: >-
      [WHY] Interpolating a secret into a log f-string leaks credentials into log
      storage. Security standards: "Never log passwords, tokens, secrets."
      [HOW] Remove the secret from the f-string. Log only the operation outcome.
    pattern-regex: "(?:logger|logging)\\.(?:info|error|warning|debug)\\(f['\"].*\\{.*(?:password|secret|token|api_key).*\\}"
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md
