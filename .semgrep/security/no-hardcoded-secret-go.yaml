rules:
  - id: security.hardcoded-secret-go
    languages: [go]
    severity: ERROR
    message: >-
      [WHY] Hardcoded secret in source code. Security standards: "Never commit secrets;
      store in secret manager or env." Hardcoded credentials get pushed to version
      control and exposed through binary inspection.
      [HOW] Load from environment: `os.Getenv("API_KEY")` or use a secret manager.
      Validate required env vars at startup with fail-fast.
    pattern-regex: "(?i)(?:password|secret|apikey|api_key|token|private_key)\\s*(?::=|=)\\s*\"[^\"]{8,}\""
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md
