rules:
  - id: security.secret-in-console-log-typescript
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [WHY] Logging a variable named password/secret/token/apiKey leaks credentials
      into browser console, server logs, or monitoring. Security standards: "Never log
      passwords, tokens, secrets, full PII."
      [HOW] Remove the sensitive value. Log only the operation result, or use a
      redacted placeholder: `console.log('auth result:', success)`.
    pattern-either:
      - pattern: console.log(..., $SECRET, ...)
      - pattern: console.error(..., $SECRET, ...)
      - pattern: console.warn(..., $SECRET, ...)
      - pattern: console.debug(..., $SECRET, ...)
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md

  - id: security.secret-in-template-literal-log-typescript
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [WHY] Interpolating a secret into a log template literal leaks credentials.
      [HOW] Remove the secret from the template. Log only the operation outcome.
    pattern-regex: "console\\.(?:log|error|warn|debug)\\(`[^`]*\\$\\{[^}]*(?:password|secret|token|apiKey|api_key)[^}]*\\}"
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md
