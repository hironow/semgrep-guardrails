rules:
  - id: security.password-in-log-go
    languages: [go]
    severity: ERROR
    message: >-
      [WHY] Logging a variable named `password`/`secret`/`token`/`apiKey` leaks
      credentials into log storage, monitoring systems, and potentially third-party
      services. Security standards mandate: "Do not log passwords, tokens, secrets."
      [HOW] Remove the sensitive value from the log statement. If you must reference
      the secret's existence, log a redacted placeholder: `"password=***"` or log
      only the operation result (`"auth succeeded for user X"`).
    pattern-either:
      - pattern: log.Printf(..., $PASSWORD, ...)
      - pattern: log.Println(..., $PASSWORD, ...)
      - pattern: $LOGGER.Info(..., $PASSWORD, ...)
      - pattern: $LOGGER.Error(..., $PASSWORD, ...)
      - pattern: $LOGGER.Debug(..., $PASSWORD, ...)
      - pattern: $LOGGER.Warn(..., $PASSWORD, ...)
      - pattern: fmt.Printf(..., $PASSWORD, ...)
    metadata:
      category: security
      rule-origin: >-
        ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md
        + error-handling.md (Logging rules)
    options:
      symbolic_propagation: true
