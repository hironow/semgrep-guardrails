rules:
  - id: security.hardcoded-secret-typescript
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      [WHY] Hardcoded secret in source code. Security standards: "Never commit secrets;
      store in secret manager or env."
      [HOW] Load from environment: `process.env.API_KEY` or use a secret manager.
      Validate at startup.
    pattern-regex: "(?i)(?:password|secret|apiKey|api_key|token|privateKey|private_key)\\s*=\\s*[\"'][^\"']{8,}[\"']"
    paths:
      exclude:
        - "**/*.test.*"
        - "**/*.spec.*"
        - "**/tests/**"
        - "**/__tests__/**"
    metadata:
      category: security
      rule-origin: ai-tools/okite-ai/.kiro/settings/templates/steering-custom/security.md
