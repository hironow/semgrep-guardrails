rules:
  - id: naming.ambiguous-suffix-class-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Class `$NAME` uses an ambiguous suffix. Avoid Manager, Util, Facade,
      Service, Runtime, Engine in new type names. Consider a more specific
      name based on its responsibility:
      Data -> Registry/Catalog/Store,
      Selection -> Policy/Selector/Router,
      Coordination -> Coordinator/Dispatcher/Controller,
      Creation -> Factory/Builder,
      Transformation -> Adapter/Bridge/Mapper,
      Execution -> Executor/Scheduler/Evaluator.
    patterns:
      - pattern: class $NAME { ... }
      - metavariable-regex:
          metavariable: $NAME
          regex: ^[A-Z].*(?:Manager|Util|Facade|Service|Runtime|Engine)$
    metadata:
      category: naming
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        曖昧なサフィックス(Manager, Util, Facade, Service, Runtime, Engine)を
        持つ型名を検出します。責務に応じた具体的な命名を使用してください。

  - id: naming.ambiguous-suffix-interface-typescript
    languages: [typescript]
    severity: WARNING
    message: >-
      Interface uses an ambiguous suffix. Avoid Manager, Util, Facade,
      Service, Runtime, Engine in new type names. Use a name that reflects
      the specific responsibility.
    pattern-regex: "interface\\s+[A-Z]\\w*(?:Manager|Util|Facade|Service|Runtime|Engine)\\s*\\{"
    metadata:
      category: naming
      rule-origin: ai-tools/COMMON.md

  - id: naming.ambiguous-suffix-type-alias-typescript
    languages: [typescript]
    severity: WARNING
    message: >-
      Type alias `$NAME` uses an ambiguous suffix. Avoid Manager, Util, Facade,
      Service, Runtime, Engine in new type names. Use a name that reflects
      the specific responsibility.
    patterns:
      - pattern: type $NAME = $TYPE
      - metavariable-regex:
          metavariable: $NAME
          regex: ^[A-Z].*(?:Manager|Util|Facade|Service|Runtime|Engine)$
    metadata:
      category: naming
      rule-origin: ai-tools/COMMON.md
