rules:
  - id: naming.ambiguous-suffix-class-python
    languages: [python]
    severity: WARNING
    message: >-
      [WHY] Class `$NAME` uses a prohibited suffix (Manager/Util/Facade/Service/Runtime/Engine).
      These suffixes attract unrelated responsibilities, causing the class to become a
      dumping ground with blurred boundaries. The name alone should tell you what the type
      IS and what it depends on.
      [HOW] Replace with a responsibility-specific name:
      Data storage → Registry/Catalog/Store,
      Selection/routing → Policy/Selector/Router,
      Coordination → Coordinator/Dispatcher/Controller,
      Creation → Factory/Builder,
      Transformation → Adapter/Bridge/Mapper,
      Execution → Executor/Scheduler/Evaluator.
      Exception: names from external frameworks (e.g., Django's ModelAdmin) need not be renamed.
    patterns:
      - pattern-either:
          - pattern: |
              class $NAME(...):
                  ...
          - pattern: |
              class $NAME:
                  ...
      - metavariable-regex:
          metavariable: $NAME
          regex: ^[A-Z].*(?:Manager|Util|Facade|Service|Runtime|Engine)$
    metadata:
      category: naming
      rule-origin: ai-tools/AGENTS.md - 曖昧なサフィックスを避ける
