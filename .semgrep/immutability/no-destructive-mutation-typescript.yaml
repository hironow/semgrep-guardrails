rules:
  - id: immutability.no-array-push-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.push(...)` mutates the array in place. Prefer `[...$X, item]`
      to create a new array. Destructive array methods cause unintended
      side effects when references are shared.
    pattern: $X.push(...)
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        push()は配列を破壊的に変更します。スプレッド構文で
        新しい配列を作成してください。

  - id: immutability.no-array-pop-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.pop()` mutates the array in place. Prefer `$X.slice(0, -1)`
      to create a new array without the last element.
    pattern: $X.pop()
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-array-splice-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.splice(...)` mutates the array in place. Use `$X.slice()` combined
      with spread to create a new array with the desired modifications.
    pattern: $X.splice(...)
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-array-sort-inplace-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.sort(...)` mutates the array in place. Use `[...$X].sort(...)` or
      `$X.toSorted(...)` to create a new sorted array.
    pattern: $X.sort(...)
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-array-reverse-inplace-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.reverse()` mutates the array in place. Use `[...$X].reverse()` or
      `$X.toReversed()` to create a new reversed array.
    pattern: $X.reverse()
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-array-unshift-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.unshift(...)` mutates the array in place. Prefer `[item, ...$X]`
      to create a new array with the element prepended.
    pattern: $X.unshift(...)
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-array-fill-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.fill(...)` mutates the array in place. Use `$X.map(() => value)`
      or `Array.from(...)` to create a new filled array.
    pattern: $X.fill(...)
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-array-copywithin-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `$X.copyWithin(...)` mutates the array in place. Create a copy first
      with `[...$X]` before calling copyWithin.
    pattern: $X.copyWithin(...)
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-delete-property-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      `delete $X.$PROP` mutates the object in place. Prefer destructuring
      to create a new object without the property:
      `const { $PROP, ...rest } = $X`.
    pattern: delete $X.$PROP
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        deleteはオブジェクトを破壊的に変更します。分割代入で
        プロパティを除外した新しいオブジェクトを作成してください。

  - id: immutability.no-param-property-mutation-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Direct mutation of parameter property `$PARAM.$FIELD = $VAL`. Prefer
      returning a new object: `{ ...$PARAM, $FIELD: $VAL }` to avoid
      unintended side effects on the caller.
    pattern: |
      function $FUNC(..., $PARAM, ...) {
          ...
          $PARAM.$FIELD = $VAL
          ...
      }
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        関数引数のプロパティを直接変更しています。スプレッド構文で
        新しいオブジェクトを作成してください。

  - id: immutability.no-nested-property-mutation-typescript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      Direct nested mutation `$PARAM.$A.$B = $VAL`. Prefer creating a new
      object with spread: `{ ...$PARAM, $A: { ...$PARAM.$A, $B: $VAL } }`.
    pattern: |
      function $FUNC(..., $PARAM, ...) {
          ...
          $PARAM.$A.$B = $VAL
          ...
      }
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        ネストされたプロパティの直接変更を検出しました。
        スプレッド構文で深いコピーを作成してください。
