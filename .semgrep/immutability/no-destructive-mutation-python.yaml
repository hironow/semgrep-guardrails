rules:
  - id: immutability.no-list-append-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.append(...)` mutates the list argument in place. Prefer creating
      a new list: `[*$PARAM, item]` to avoid unintended side effects on the caller.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.append(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        関数引数のリストに対してappend()を呼び出しています。
        呼び出し元のリストが意図せず変更されます。新しいリストを作成してください。

  - id: immutability.no-list-extend-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.extend(...)` mutates the list argument in place. Prefer creating
      a new list: `[*$PARAM, *other]` to avoid unintended side effects.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.extend(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-dict-mutation-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM[$KEY] = $VAL` mutates the dict argument in place. Prefer creating
      a new dict: `{**$PARAM, key: val}` to avoid unintended side effects.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM[$KEY] = $VAL
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
      description-ja: >-
        関数引数の辞書を直接変更しています。新しい辞書を作成してください。

  - id: immutability.no-list-sort-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.sort()` mutates the list in place. Use `sorted($PARAM)` to return
      a new sorted list without modifying the original.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.sort(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-list-insert-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.insert(...)` mutates the list argument in place. Prefer creating
      a new list with slicing: `[*$PARAM[:i], item, *$PARAM[i:]]`.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.insert(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-list-remove-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.remove(...)` mutates the list argument in place. Prefer creating
      a new list: `[x for x in $PARAM if x != val]`.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.remove(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-list-clear-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.clear()` mutates the collection in place. Assign a new empty
      collection instead of clearing the argument.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.clear()
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-list-reverse-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.reverse()` mutates the list in place. Use `list(reversed($PARAM))`
      or `$PARAM[::-1]` to create a new reversed list.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.reverse()
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-dict-update-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.update(...)` mutates the dict argument in place. Prefer creating
      a new dict: `{**$PARAM, **other}` or `$PARAM | other` (Python 3.9+).
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.update(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md

  - id: immutability.no-dict-pop-param-python
    languages: [python]
    severity: WARNING
    message: >-
      `$PARAM.pop(...)` mutates the dict/list argument in place. For dicts,
      use `{k: v for k, v in $PARAM.items() if k != key}`. For lists,
      use slicing to create a new list.
    pattern: |
      def $FUNC(..., $PARAM, ...):
          ...
          $PARAM.pop(...)
          ...
    metadata:
      category: immutability
      rule-origin: ai-tools/COMMON.md
